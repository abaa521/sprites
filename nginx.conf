user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # 启用 Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-component text/x-cross-domain-policy;

    server {
        listen 3015;
        server_name _;

        # 设置缓存策略 (静态资源可以长期缓存)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 主要路由：/sprites/*
        location /sprites {
            alias /usr/share/nginx/html/sprites;
            autoindex on;
            try_files $uri $uri/ =404;
        }

        # 兼容根路径 (用于向后兼容)
        location / {
            root /usr/share/nginx/html/sprites;
            autoindex on;
            try_files $uri $uri/ =404;
        }

        # 处理双层 sprites 重定向
        location /sprites/sprites {
            return 301 /sprites$request_uri;
        }

        # 根路径 API 响应
        location = / {
            default_type application/json;
            return 200 '{"message":"Pokemon Sprites Server","version":"1.0.0","endpoints":{"sprites":"/sprites","pokemon":"/sprites/pokemon","items":"/sprites/items","types":"/sprites/types","badges":"/sprites/badges"}}';
            add_header Content-Type application/json;
        }

        # 健康检查端点
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 日志端点 (可选)
        location /status {
            stub_status;
            access_log off;
        }
    }
}
